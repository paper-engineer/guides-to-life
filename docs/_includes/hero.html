<!DOCTYPE html>

<section class="hero" style="background-image: url({{ include.hero.image | default: page.image | relative_url }})">
	<div class="inner-hero text-container">
		<div class="hero-text-container">
			<h1>{{ include.hero.title | default: page.title }}</h1>
			<p class="subtext">{{ include.hero.description | default: page.description }}</p>
			{% if include.hero.cta %}<div class="cta button alt"><a href="{{ include.hero.link | relative_url }}">{{ include.hero.cta }}</a></div>{% endif %}
		</div>
	</div>
	<!-- {% if include.hero.cta %}<div class="learn-more"><a href="{{ include.hero.link | relative_url }}">{{ include.hero.cta }}<span class="arrow">&#x25BC;</span></a></div>{% endif %} -->
</section>
